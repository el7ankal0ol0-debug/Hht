<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة آخر ظهور - صارحني</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }
        .status-box {
            background: #e8f4fd;
            border: 1px solid #b6e0fe;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            color: #0056b3;
            font-weight: bold;
            margin-top: 15px;
        }
        .refresh-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .refresh-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>مراقب آخر ظهور</h2>
        <p><small>MalakAbdulrahman</small></p>
        
        <div class="status-box">
            {{ last_seen }}
        </div>

        <button class="refresh-btn" onclick="window.location.reload();">تحديث الصفحة</button>
    </div>

</body>
</html>
